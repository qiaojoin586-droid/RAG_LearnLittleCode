# RAG LearnLittle 前端 nginx 配置（临时 HTTP 版，无域名 / 无证书阶段使用）
#
# 选用方式（推荐，无需手工改文件）：
#   在项目根 .env 中设置  NGINX_CONF=nginx.http.conf
#   然后 docker compose up -d --build frontend
#   —— docker-compose.yml 已把该变量透传给 front/Dockerfile 的构建参数。
#
# 与默认 nginx.conf 的差异：
#   - 删除 80 → 443 的 301 跳转（无域名/无证书时会导致访问失败）
#   - 删除 443 ssl server 块与 SSL/HSTS 相关配置（无证书时 nginx 直接启动失败）
#   - **/api/ 的 proxy_buffering off 等 SSE 配置原样保留**（不可删，否则对话流式输出被缓冲）
#
# 域名备案完成后请把 NGINX_CONF 改回 nginx.conf（见 docs/宝塔Linux服务器Docker部署方案.md §12）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源 + SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代（SSE 禁用缓冲 —— 不可删除，否则对话流式输出会被缓冲卡住）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态头像
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 安全响应头（HSTS 暂不加 —— HTTP 阶段加 HSTS 无意义）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
